name: Bug report
description: Something doesn't work the way the README says it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: chttr doctor
      description: Output of `chttr doctor` (it contains no secrets).
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`journalctl --user -u chttr --since '10 min ago'`. Remove anything you dictated that's private."
      render: text
  - type: input
    id: desktop
    attributes:
      label: Desktop
      placeholder: "Omarchy 4 / Hyprland 0.51, or GNOME 48 on Fedora 43, ..."
    validations:
      required: true
