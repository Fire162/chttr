name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --python 3.13 --group dev
      - name: ruff
        run: uv run ruff check --output-format=github .
      - name: pyright
        run: uv run pyright

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python }} --group dev
      - run: uv run pytest -q

  arch:
    name: Tests (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git uv python
      - uses: actions/checkout@v4
      - run: uv sync --python /usr/bin/python3 --group dev
      - run: uv run pytest -q

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: The wheel ships the Meet extension and the note styles
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needed in ("chttr/note_styles.toml", "chttr/extension/manifest.json", "chttr/overlay.py"):
              assert needed in names, f"{needed} missing from the wheel"
          print("ok:", len(names), "files")
          EOF
