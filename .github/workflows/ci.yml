name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --python 3.13 --group dev
      - name: ruff
        run: uv run ruff check --output-format=github .
      - name: pyright
        run: uv run pyright
      - name: Meet extension parses
        run: for f in src/chttr/extension/*.js; do node --check "$f"; done

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python }} --group dev
      - run: uv run pytest -q

  distros:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            image: archlinux:latest
            setup: pacman -Syu --noconfirm --needed git curl python
          - name: Debian 13
            image: debian:trixie
            setup: apt-get update -q && apt-get install -yq git curl python3 ca-certificates
          - name: Fedora
            image: fedora:latest
            setup: dnf install -yq git curl python3
    steps:
      - run: ${{ matrix.setup }}
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python "$(command -v python3)" --group dev
      - run: uv run pytest -q

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh bin/setup bin/chttr-status

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: The wheel ships the Meet extension and the note styles
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needed in ("chttr/note_styles.toml", "chttr/extension/manifest.json", "chttr/overlay.py"):
              assert needed in names, f"{needed} missing from the wheel"
          print("ok:", len(names), "files")
          EOF
