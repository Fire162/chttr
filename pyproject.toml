[project]
name = "chttr"
version = "0.1.0"
description = "Voice dictation and meeting transcripts for Omarchy / Hyprland"
authors = [
    { name = "Rob Behbahani" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.13.0",
    "icalendar>=7.3.0",
    "onnx-asr[cpu]>=0.12.0",
    "pywhispercpp>=1.5.1",
    "recurring-ical-events>=3.8.2",
]

[project.urls]
Homepage = "https://github.com/robjobbed/chttr"

[project.scripts]
chttr = "chttr:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
